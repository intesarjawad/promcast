name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  IMAGE: ghcr.io/intesarjawad/promcast
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      python: ${{ steps.names.outputs.python }}
      final: ${{ steps.names.outputs.final }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          python-version: '3.12'
      - run: uv run --no-project --with packaging python scripts/check_version.py "$GITHUB_REF_NAME"
      - id: names
        run: |
          tag=$(python3 scripts/image_tag.py)
          {
            echo "tag=$tag"
            echo "python=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
            if [[ "$tag" == *-* ]]; then echo final=false; else echo final=true; fi
          } >> "$GITHUB_OUTPUT"
  image:
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A pushed multi-arch manifest cannot be inspected locally, so the size gate builds amd64 first.
      - name: Hold the image under 1.4 GB
        run: |
          docker buildx build --platform linux/amd64 --load --tag promcast:size .
          size=$(docker image inspect promcast:size --format '{{.Size}}')
          echo "linux/amd64 image: $size bytes"
          if ((size >= 1400000000)); then
            echo "The image is $size bytes, at or above the 1.4 GB budget" >&2
            exit 1
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          TAG: ${{ needs.version.outputs.tag }}
          FINAL: ${{ needs.version.outputs.final }}
        run: |
          {
            echo 'list<<EOF'
            echo "$IMAGE:$TAG"
            if [[ "$FINAL" == true ]]; then echo "$IMAGE:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.list }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
  pypi:
    needs: [version, checks]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/promcast
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          python-version: '3.12'
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  chart:
    needs: [version, checks, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - env:
          TAG: ${{ needs.version.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/promcast --version "$TAG" --app-version "$TAG"
          helm push "promcast-$TAG.tgz" oci://ghcr.io/intesarjawad/charts
  compose:
    needs: [version, checks, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          TAG: ${{ needs.version.outputs.tag }}
          FINAL: ${{ needs.version.outputs.final }}
        run: |
          artifacts=("ghcr.io/intesarjawad/promcast-demo:$TAG")
          if [[ "$FINAL" == true ]]; then artifacts+=(ghcr.io/intesarjawad/promcast-demo:latest); fi
          for artifact in "${artifacts[@]}"; do
            docker compose -f deploy/demo/compose.yaml publish --yes --resolve-image-digests "$artifact"
          done
  coldstart:
    needs: [version, image, pypi, compose]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, path: uvx}
          - {runner: ubuntu-24.04-arm, path: uvx}
          - {runner: macos-latest, path: uvx}
          - {runner: windows-latest, path: uvx}
          - {runner: ubuntu-latest, path: docker}
          - {runner: ubuntu-latest, path: oci}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          python-version: '3.12'
      - if: matrix.path != 'uvx'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          scripts/coldstart.sh --path "${{ matrix.path }}" --pypi "$VERSION"
          mv coldstart.json "coldstart-${{ matrix.path }}-demo.json"
      - if: matrix.path == 'uvx'
        run: |
          scripts/coldstart.sh --path uvx --pypi "$VERSION" --stock
          mv coldstart.json coldstart-uvx-stock.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coldstart-${{ matrix.runner }}-${{ matrix.path }}
          path: coldstart-*.json
          if-no-files-found: ignore
