name: promcast-recorder

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
      - --web.listen-address=${RECORDER_BIND_ADDRESS:-127.0.0.1}:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - type: bind
        source: ${RECORDER_TARGETS_DIR:-${HOME}/.config/promcast/targets}
        target: /etc/prometheus/targets
        read_only: true
        bind:
          create_host_path: false
      - recorder-data:/prometheus

  node_exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave

volumes:
  recorder-data:
