name: promcast-demo

services:
  history:
    image: python:3.12-slim
    command: [python, /demo/scenario.py, --backfill, --hours, '72', --out, /work/history.om]
    volumes:
      - ./demo/scenario.py:/demo/scenario.py:ro
      - work:/work

  backfill:
    image: prom/prometheus:v3.15.1
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ -f /prometheus/.backfill-started ]; then
          echo 'Backfill was interrupted; restore the demo volumes before retrying.' >&2
          exit 1
        fi
        if [ -f /prometheus/.backfill-complete ] || [ -d /prometheus/wal ]; then exit 0; fi
        if find /prometheus -mindepth 1 -maxdepth 1 | grep -q .; then
          echo 'Unmarked TSDB data; restore the original demo volumes before retrying.' >&2
          exit 1
        fi
        touch /prometheus/.backfill-started
        promtool tsdb create-blocks-from openmetrics /work/history.om /prometheus
        mv /prometheus/.backfill-started /prometheus/.backfill-complete
    depends_on:
      history:
        condition: service_completed_successfully
    volumes:
      - work:/work:ro
      - prometheus-data:/prometheus

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      backfill:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:9090:9090
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
      - ./demo/promcast.rules.yml:/etc/prometheus/demo/promcast.rules.yml:ro
      - ./demo/demo.rules.yml:/etc/prometheus/demo/demo.rules.yml:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:9090/-/ready]
      interval: 5s
      timeout: 2s
      retries: 24

  alertmanager:
    image: prom/alertmanager:v0.34.2
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    configs:
      - source: alertmanager
        target: /etc/alertmanager/alertmanager.yml
    ports:
      - 127.0.0.1:9093:9093

  scenario:
    image: python:3.12-slim
    command: [python, /demo/scenario.py, --serve, --anchor-file, /work/anchor]
    depends_on:
      history:
        condition: service_completed_successfully
    volumes:
      - ./demo/scenario.py:/demo/scenario.py:ro
      - work:/work:ro

  promcast:
    image: ghcr.io/intesarjawad/promcast:${PROMCAST_VERSION:-0.1.0}
    build: .
    command: [serve, --config, /etc/promcast.yaml]
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - ./demo/promcast.yaml:/etc/promcast.yaml:ro
    ports:
      - 127.0.0.1:8787:8787

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/promcast.json
    volumes:
      - ./grafana/provisioning/datasources/promcast.yml:/etc/grafana/provisioning/datasources/promcast.yml:ro
      - ./grafana/provisioning/dashboards/promcast.yml:/etc/grafana/provisioning/dashboards/promcast.yml:ro
      - ./grafana/dashboards/promcast.json:/var/lib/grafana/dashboards/promcast.json:ro
    ports:
      - 127.0.0.1:3000:3000

volumes:
  work:
  prometheus-data:

configs:
  prometheus:
    content: |
      global:
        scrape_interval: 5s
        evaluation_interval: 15s
      rule_files:
        - /etc/prometheus/demo/promcast.rules.yml
        - /etc/prometheus/demo/demo.rules.yml
      alerting:
        alertmanagers:
          - static_configs:
              - targets: ['alertmanager:9093']
      scrape_configs:
        - job_name: scenario
          static_configs:
            - targets: ['scenario:9100']
        - job_name: promcast
          static_configs:
            - targets: ['promcast:8787']
        - job_name: prometheus
          static_configs:
            - targets: ['localhost:9090']
  alertmanager:
    content: |
      route:
        receiver: demo
        group_by: [alertname]
        group_wait: 0s
        group_interval: 15s
        repeat_interval: 1h
      receivers:
        - name: demo
