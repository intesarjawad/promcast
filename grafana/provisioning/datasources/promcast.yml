apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
  - name: Promcast
    uid: promcast
    type: prometheus
    access: proxy
    url: http://promcast:8787
    jsonData:
      timeInterval: 1m
