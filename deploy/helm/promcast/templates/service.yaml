apiVersion: v1
kind: Service
metadata:
  name: {{ include "promcast.fullname" . }}
  labels:
    {{- include "promcast.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ include "promcast.port" . | int }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "promcast.selectorLabels" . | nindent 4 }}
